<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUNO App</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #39e6c0;
  font-size: 32px;
  font-weight: bold;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: bold;
}

.language {
  background: #26364b;
  color: white;
}

.welcome {
  margin-top: 40px;
  padding: 25px;
  background: #1c2a3d;
  border-radius: 20px;
}

.welcome h1 {
  font-size: 29px;
}

.welcome p {
  color: #bdc7d5;
  line-height: 1.6;
}

.start {
  width: 100%;
  background: #39e6c0;
  color: #101827;
  font-size: 17px;
  margin-top: 15px;
}

h2 {
  margin-top: 35px;
}

.features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.card {
  padding: 22px 12px;
  border-radius: 16px;
  background: #25364b;
  text-align: center;
  cursor: pointer;
}

.card span {
  font-size: 32px;
}

.card h3 {
  font-size: 16px;
}

.card p {
  font-size: 12px;
  color: #bdc7d5;
}

footer {
  text-align: center;
  color: #8997aa;
  margin: 40px 0 15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ZUNO.</div>
  <button class="language" onclick="changeLanguage()">
    हिन्दी / EN
  </button>
</header>

<section class="welcome">
  <h1 id="heading">Welcome to ZUNO!</h1>
  <p id="description">
    One App. Every Generation.
    Discover entertainment, knowledge and fun.
  </p>

  <button class="start" onclick="startApp()">
    Continue as Guest
  </button>
</section>

<h2 id="explore">Explore ZUNO</h2>

<section class="features">

  <div class="card" onclick="openFeature('Entertainment')">
    <span>🎬</span>
    <h3 id="f1">Entertainment</h3>
    <p>Watch and enjoy</p>
  </div>

  <div class="card" onclick="openFeature('Knowledge')">
    <span>📚</span>
    <h3 id="f2">Knowledge</h3>
    <p>Learn something new</p>
  </div>

  <div class="card" onclick="openFeature('Community')">
    <span>🌍</span>
    <h3 id="f3">Community</h3>
    <p>Connect with people</p>
  </div>

  <div class="card" onclick="openFeature('Games & Help')">
    <span>🎮</span>
    <h3 id="f4">Games & Help</h3>
    <p>Play and explore</p>
  </div>

</section>

<footer>
  © 2026 ZUNO. All rights reserved.
</footer>

<script>
let hindi = false;

function changeLanguage() {
  hindi = !hindi;

  document.getElementById("heading").innerText =
    hindi ? "ZUNO में आपका स्वागत है!" : "Welcome to ZUNO!";

  document.getElementById("description").innerText =
    hindi ? "एक ऐप, हर पीढ़ी के लिए। मनोरंजन और ज्ञान की दुनिया।"
    : "One App. Every Generation. Discover entertainment, knowledge and fun.";

  document.getElementById("explore").innerText =
    hindi ? "ZUNO की दुनिया" : "Explore ZUNO";

  document.getElementById("f1").innerText =
    hindi ? "मनोरंजन" : "Entertainment";

  document.getElementById("f2").innerText =
    hindi ? "ज्ञान" : "Knowledge";

  document.getElementById("f3").innerText =
    hindi ? "कम्युनिटी" : "Community";

  document.getElementById("f4").innerText =
    hindi ? "गेम्स और मदद" : "Games & Help";
}

function startApp() {
  alert("Welcome to ZUNO! Guest mode started.");
}

function openFeature(name) {
  alert(name + " section coming soon!");
}
</script>

</body>
</html>
