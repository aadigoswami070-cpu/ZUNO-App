
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZUNO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #39e6c0;
    }

    .welcome {
      text-align: center;
      padding: 65px 20px;
    }

    h1 {
      font-size: 38px;
    }

    p {
      color: #bdc7d5;
      font-size: 17px;
    }

    button {
      display: block;
      width: 85%;
      max-width: 300px;
      margin: 18px auto;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #39e6c0;
      color: #101827;
      font-size: 17px;
      font-weight: bold;
    }

    .guest {
      background: #26364b;
      color: white;
      border: 1px solid #39e6c0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #8794a8;
    }
  </style>
</head>

<body>

  <header>ZUNO</header>

  <section class="welcome">
    <h1>Welcome to ZUNO!</h1>

    <p>Your World. Your People. Your Space.</p>

    <button onclick="alert('Welcome to ZUNO!')">
      Get Started
    </button>

    <button class="guest"
      onclick="alert('Welcome Guest!')">
      Continue as Guest
    </button>
  </section>

  <footer>
    © 2026 ZUNO. All rights reserved.
  </footer>

</body>
</html>
